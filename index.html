<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Napco iLock SDK Documentation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #2c3e50, #3498db);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      text-align: center;
      background-color: rgba(0, 0, 0, 0.3);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    }

    h1 {
      margin-bottom: 30px;
      font-size: 2.2rem;
    }

    a {
      display: inline-block;
      margin: 10px 20px;
      padding: 15px 30px;
      font-size: 1.1rem;
      text-decoration: none;
      color: #fff;
      border: 2px solid #fff;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    a:hover {
      background-color: #fff;
      color: #3498db;
    }

    @media (max-width: 600px) {
      a {
        display: block;
        margin: 15px auto;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Napco iLock SDK Documentation</h1>
    <a href="https://napcodev.github.io/ilocksdkdocs/documentation/napcoilocksdk" target="_blank">
      Napco iLock SDK for iOS Documentation
    </a>
    <a href="https://napcodev.github.io/ilocksdkandroiddocs" target="_blank">
      Napco iLock SDK for Android Documentation
    </a>
  </div>
</body>
</html>
