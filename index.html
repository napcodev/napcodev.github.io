<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Napco iLock SDK Docs</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --background: #f8f9fa;
      --text-color: #1f2937;
      --accent-color: #c8102e; /* Napco-style red */
      --accent-hover: #a10d25;
      --container-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--background);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background-color: var(--container-bg);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      font-size: 1.9rem;
      margin-bottom: 30px;
      font-weight: 600;
      color: var(--accent-color);
    }

    a.button {
      display: block;
      margin: 15px 0;
      padding: 14px 24px;
      border-radius: 8px;
      background-color: var(--accent-color);
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    a.button:hover {
      background-color: var(--accent-hover);
    }

    @media (max-width: 500px) {
      .container {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Napco iLock SDK Documentation</h1>
    <a class="button" href="https://napcodev.github.io/ilocksdkdocs/documentation/napcoilocksdk" target="_blank">
      📱 iOS SDK Documentation
    </a>
    <a class="button" href="https://napcodev.github.io/ilocksdkandroiddocs" target="_blank">
      🤖 Android SDK Documentation
    </a>
  </div>
</body>
</html>
